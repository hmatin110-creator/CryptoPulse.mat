name: Build CryptoPulse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK and show error
        id: build
        run: |
          set +e

          gradle assembleDebug --stacktrace > build.log 2>&1

          CODE=$?

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

          echo "## 🔧 CryptoPulse Build Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$CODE" = "0" ]; then
            echo "### ✅ Build succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Build failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Error details" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"

            grep -E \
              "FAILURE:|What went wrong:|Execution failed|A problem occurred|e: |error:|Could not|Unresolved reference|Type mismatch" \
              build.log | tail -100 >> "$GITHUB_STEP_SUMMARY"

            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          exit 0

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "❌ CryptoPulse build failed."
          exit 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
