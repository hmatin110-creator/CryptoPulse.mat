name: Build CryptoPulse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Kotlin and capture real error
        id: build
        shell: bash
        run: |
          set +e

          gradle :app:compileDebugKotlin --stacktrace --info > build.log 2>&1

          CODE=$?

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

          echo "## 🔧 CryptoPulse Kotlin Diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$CODE" = "0" ]; then
            echo "## ✅ Kotlin compilation succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Kotlin compilation failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "### 🔴 Compiler messages" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"

            grep -i -E \
              "error|unresolved|type mismatch|cannot|expecting|conflicting|overload|exception|e:" \
              build.log | tail -200 >> "$GITHUB_STEP_SUMMARY"

            echo '```' >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 📍 Kotlin source locations" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"

            grep -E \
              "file:///.*\.kt:[0-9]+:[0-9]+" \
              build.log | tail -100 >> "$GITHUB_STEP_SUMMARY"

            echo '```' >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 🧾 Last 80 lines before failure" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"

            tail -80 build.log >> "$GITHUB_STEP_SUMMARY"

            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          exit 0

      - name: Stop if compilation failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "Kotlin compilation failed."
          exit 1

      - name: Build APK
        if: success()
        run: |
          gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
