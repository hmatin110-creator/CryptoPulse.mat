name: Diagnose CryptoPulse

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          echo "===== ROOT ====="
          pwd
          ls -la
          echo "===== ALL FILES ====="
          find . -maxdepth 3 -type f -print

      - name: Find ZIP
        run: |
          echo "===== ZIP SEARCH ====="
          find . -type f -iname "*.zip" -print

      - name: Find Android project
        run: |
          echo "===== GRADLE FILES ====="
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print
