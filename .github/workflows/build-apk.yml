name: Diagnose Gradle

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project
        run: |
          echo "===== ROOT ====="
          ls -la
          echo "===== GRADLE FILES ====="
          find . -maxdepth 3 -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Gradle diagnostic
        run: |
          gradle tasks --stacktrace 2>&1 | tee gradle-error.txt
          echo "===== IMPORTANT ERRORS ====="
          grep -Ei "error:|FAILURE:|Could not|A problem occurred|Caused by:" gradle-error.txt | tail -30 || true
