name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check ZIP
        run: |
          echo "=== Repository files ==="
          find . -maxdepth 2 -type f -print
          echo "=== ZIP files ==="
          find . -type f -name "*.zip" -print

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "=== Project files ==="
          find project -maxdepth 3 -type f -print

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPulse-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
