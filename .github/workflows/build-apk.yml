name: Find Android Build Error

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and show error
        run: |
          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          CODE=$?

          echo "================ ERROR SUMMARY ================"

          grep -E "FAILURE:|What went wrong:|Execution failed|Could not|A problem occurred|Caused by:|SDK|Android" build.log | tail -40 || true

          echo "================ LAST 30 LINES ================"
          tail -30 build.log

          echo "================ EXIT CODE ================"
          echo "$CODE"

          exit 0
