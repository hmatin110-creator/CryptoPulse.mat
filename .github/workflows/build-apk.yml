name: Build CryptoPulse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK and save log
        run: |
          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          CODE=$?
          echo "EXIT_CODE=$CODE" >> build.log
          exit 0

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPulse-build-log
          path: build.log
          if-no-files-found: error

      - name: Fail if build failed
        run: |
          if grep -q "EXIT_CODE=0" build.log; then
            echo "Build succeeded"
          else
            echo "Build failed"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
