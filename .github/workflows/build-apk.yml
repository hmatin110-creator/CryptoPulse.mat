name: Build CryptoPulse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          CODE=$?

          echo "===== BUILD ERROR ====="
          grep -E "FAILURE:|What went wrong:|Execution failed|Could not|A problem occurred|e: |error:" build.log | tail -80 || true

          echo "===== LAST 80 LINES ====="
          tail -80 build.log

          exit $CODE

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
